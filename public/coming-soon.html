<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefly - Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
    }
    .logo {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
      opacity: 0.9;
      line-height: 1.6;
    }
    .signup-form {
      display: flex;
      gap: 1rem;
      max-width: 500px;
      margin: 0 auto 2rem;
    }
    input {
      flex: 1;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
    }
    button {
      padding: 1rem 2rem;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    .features {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 3rem;
      flex-wrap: wrap;
    }
    .feature {
      text-align: center;
    }
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .feature-text {
      font-size: 0.9rem;
      opacity: 0.8;
    }
    .success-message {
      display: none;
      background: rgba(255,255,255,0.2);
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 1rem;
    }
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📰</div>
    <h1>Briefly</h1>
    <p>Your AI-powered daily intelligence briefing. Stay informed on tech, markets, AI, and world news in 5 minutes every morning.</p>
    
    <form class="signup-form" id="signupForm">
      <input type="email" id="email" placeholder="Enter your email" required>
      <button type="submit">Get Early Access</button>
    </form>
    
    <div class="success-message" id="successMessage">
      ✅ You're on the list! We'll notify you when Briefly launches.
    </div>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🎯</div>
        <div class="feature-text">AI-Curated</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🎙️</div>
        <div class="feature-text">Audio + Text</div>
      </div>
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <div class="feature-text">5 Minutes</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📧</div>
        <div class="feature-text">Email/Slack</div>
      </div>
    </div>
  </div>
  
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      
      // For now, just show success (would connect to backend in production)
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('successMessage').classList.add('show');
      
      // Log to console (would send to server in production)
      console.log('New signup:', email);
    });
  </script>
</body>
</html>
